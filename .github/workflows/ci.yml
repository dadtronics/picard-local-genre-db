name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Picard 3.0.5 bundles Python 3.14.
          python-version: "3.14"
      - name: Qt runtime libraries (headless settings-page test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install tools
        run: python -m pip install --upgrade pip pytest ruff PyQt6
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Tag matches MANIFEST version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('MANIFEST.toml','rb'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MANIFEST.toml version $version"
            exit 1
          fi
