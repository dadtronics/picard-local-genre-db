license_url = "https://www.gnu.org/licenses/old-licenses/gpl-2.0.html"
homepage = "https://github.com/dadtronics/picard-local-genre-db"
long_description = """
Reads a local genre/style taxonomy built with picard-genre-db and applies
canonical Genre and Grouping tags in MusicBrainz Picard.

- Point it at your taxonomy.db in Options -> Plugins -> Local Genre DB.
- Decisions (per recording, release, release group or artist) overwrite
  Picard's genres; alias mappings fill blanks.
- Reads SQLite directly, with taxonomy.json as a fallback.
"""
